<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="晴时 —— 个人练手用的天气客户端。实时天气、24 小时预报、7 天预报、空气质量、预警与分钟级降水，Flutter 单代码库直连和风天气。">
  <meta name="theme-color" content="#3D8FD6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="晴时">
  <base href="$FLUTTER_BASE_HREF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>晴时 · 天气</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #3D8FD6;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(180deg, #3D8FD6 0%, #74B9E8 100%);
      color: #fff;
      z-index: 9999;
      transition: opacity .45s ease;
    }
    #boot-splash .logo {
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 8px;
      text-indent: 8px;
      opacity: .95;
    }
    #boot-splash .hint {
      font-size: 12px;
      opacity: .62;
      letter-spacing: 1px;
    }
    #boot-splash .bar {
      width: 128px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .22);
      overflow: hidden;
    }
    #boot-splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: rgba(255, 255, 255, .85);
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="logo">晴时</div>
    <div class="bar"></div>
    <div class="hint" id="boot-hint">正在准备天空…</div>
  </div>

  <!--
    首帧渲染完就把启动页淡出。三条信号取最先到的：
    1) Flutter 引擎回调的 flutter-first-frame 事件（最准）
    2) DOM 里出现 flutter-view / flt-glass-pane（兜底）
    3) 15 秒超时：淡出但保留提示文案，避免引擎挂了只剩一片蓝
  -->
  <script>
    (function () {
      var splash = document.getElementById('boot-splash');
      var hint = document.getElementById('boot-hint');
      var done = false;

      function hide() {
        if (done || !splash) return;
        done = true;
        splash.classList.add('hide');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 600);
      }

      window.addEventListener('flutter-first-frame', hide, { once: true });

      var obs = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          obs.disconnect();
          setTimeout(hide, 120);
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });

      setTimeout(function () {
        if (hint) {
          hint.textContent = '首次加载需要下载引擎，稍等一下…';
        }
      }, 8000);
      setTimeout(hide, 20000);

      // 引擎脚本自身出错时，至少让人知道是加载失败而不是空白
      window.addEventListener('error', function () {
        if (hint) hint.textContent = '加载失败，请刷新页面重试';
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
